name: Build AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Patch native — fullscreen immersive mode + real app icon
        run: |
          cat > android/app/src/main/java/com/petalaxe/zenpetals/MainActivity.java << 'EOF'
          package com.petalaxe.zenpetals;

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat c =
                WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.systemBars());
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
            }
          }
          EOF
          python3 -m pip install --quiet pillow
          python3 - << 'PY'
          from PIL import Image
          import os
          src = Image.open("store/icon.png").convert("RGBA")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,
                   "mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for d,s in sizes.items():
              p = "android/app/src/main/res/" + d
              os.makedirs(p, exist_ok=True)
              im = src.resize((s,s), Image.LANCZOS)
              im.save(p + "/ic_launcher.png")
              im.save(p + "/ic_launcher_round.png")
              fg = src.resize((int(s*1.5),int(s*1.5)), Image.LANCZOS)
              fg.save(p + "/ic_launcher_foreground.png")
          print("icon installed at all densities")
          PY
      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/release.jks
      - name: Verify signing inputs (keystore + passwords + alias)
        env:
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          SZ=$(stat -c%s $GITHUB_WORKSPACE/release.jks 2>/dev/null || echo 0)
          if [ "$SZ" -lt 1000 ]; then
            echo "::error::release.jks decoded to only $SZ bytes. ANDROID_KEYSTORE_BASE64 is missing, empty, or a PARTIAL paste. Open keystore.b64, Select ALL (long-press > Select All), copy, update the secret, re-run."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS secret is missing. Set it to: zenpetals"
            exit 1
          fi
          if [ "$KS_PASS" != "$KEY_PASS" ]; then
            echo "::error::PKCS12 keystores need ANDROID_KEY_PASSWORD to be IDENTICAL to ANDROID_STORE_PASSWORD. Settings > Secrets > Actions > update ANDROID_KEY_PASSWORD to the same value, then re-run."
            exit 1
          fi
          if ! keytool -list -keystore $GITHUB_WORKSPACE/release.jks -storepass:env KS_PASS -keypass:env KEY_PASS -alias "$KEY_ALIAS" >/dev/null 2>/tmp/kt.err; then
            echo "::error::Keystore check failed (wrong password, corrupted keystore, or wrong alias): $(tr '\n' ' ' < /tmp/kt.err | cut -c1-300)"
            exit 1
          fi
          echo "signing inputs verified OK"
      - name: Build signed AAB + APK
        run: |
          cd android
          chmod +x gradlew
          if ! ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > /tmp/gradle.log 2>&1; then
            {
              echo "### Gradle failed — last 40 lines (readable by your AI assistant too)"
              echo '```'
              tail -n 40 /tmp/gradle.log
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: zen-petals-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zen-petals-apk
          path: android/app/build/outputs/apk/release/*.apk
