name: Build AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/release.jks
      - name: Verify signing inputs (keystore + passwords + alias)
        env:
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          SZ=$(stat -c%s $GITHUB_WORKSPACE/release.jks 2>/dev/null || echo 0)
          if [ "$SZ" -lt 1000 ]; then
            echo "::error::release.jks decoded to only $SZ bytes. ANDROID_KEYSTORE_BASE64 is missing, empty, or a PARTIAL paste. Open keystore.b64, Select ALL (long-press > Select All), copy, update the secret, re-run."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS secret is missing. Set it to: zenpetals"
            exit 1
          fi
          if ! keytool -list -keystore $GITHUB_WORKSPACE/release.jks -storepass:env KS_PASS -keypass:env KEY_PASS -alias "$KEY_ALIAS" >/dev/null 2>/tmp/kt.err; then
            echo "::error::Keystore check failed (wrong password, corrupted keystore, or wrong alias): $(tr '\n' ' ' < /tmp/kt.err | cut -c1-300)"
            exit 1
          fi
          echo "signing inputs verified OK"
      - name: Build signed AAB + APK
        run: |
          cd android
          chmod +x gradlew
          if ! ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > /tmp/gradle.log 2>&1; then
            {
              echo "### Gradle failed — last 40 lines (readable by your AI assistant too)"
              echo '```'
              tail -n 40 /tmp/gradle.log
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: zen-petals-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zen-petals-apk
          path: android/app/build/outputs/apk/release/*.apk
