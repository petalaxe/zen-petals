name: Make signing keystore
on:
  workflow_dispatch:
    inputs:
      alias:
        description: "key alias e.g. zenpetals"
        required: true
      yourName:
        description: "your name for the certificate (e.g. PetalAxe Studios)"
        required: true
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Password secrets not found. Settings > Secrets and variables > Actions > add ANDROID_STORE_PASSWORD and ANDROID_KEY_PASSWORD, then re-run."
            exit 1
          fi
          if [ ${#KS_PASS} -lt 6 ]; then
            echo "::error::ANDROID_STORE_PASSWORD is only ${#KS_PASS} characters — keytool requires at least 6. Update it in Settings > Secrets > Actions, then re-run."
            exit 1
          fi
          if [ ${#KEY_PASS} -lt 6 ]; then
            echo "::error::ANDROID_KEY_PASSWORD is only ${#KEY_PASS} characters — keytool requires at least 6. Update it in Settings > Secrets > Actions, then re-run."
            exit 1
          fi
          if ! keytool -genkeypair -keystore release.jks -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass:env KS_PASS -keypass:env KEY_PASS \
            -dname "CN=${{ github.event.inputs.yourName }}, O=PetalAxe Studios, C=IN" 2>/tmp/kt.err; then
            echo "::error::keytool failed: $(tr '\n' ' ' < /tmp/kt.err | cut -c1-280)"
            exit 1
          fi
          base64 -w0 release.jks > keystore.b64
          echo "keystore generated OK"
      - name: Upload keystore artifact (auto-expires in 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          retention-days: 1
          path: |
            release.jks
            keystore.b64
