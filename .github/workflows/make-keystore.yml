name: Make signing keystore
on:
  workflow_dispatch:
    inputs:
      storePass:  { description: "keystore password (SAVE IT)", required: true }
      keyPass:    { description: "key password (SAVE IT)", required: true }
      alias:      { description: "key alias e.g. zenpetals", required: true }
      yourName:   { description: "your name for the certificate", required: true }
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -keystore release.jks -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "${{ github.event.inputs.storePass }}" -keypass "${{ github.event.inputs.keyPass }}" \
            -dname "CN=${{ github.event.inputs.yourName }}, O=Indie Developer, C=IN"
          base64 -w0 release.jks > keystore.b64
          keytool -list -v -keystore release.jks -storepass "${{ github.event.inputs.storePass }}" | grep -i sha256 | head -2
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: |
            release.jks
            keystore.b64
