name: Make signing keystore
on:
  workflow_dispatch:
    inputs:
      alias:
        description: "key alias e.g. zenpetals"
        required: true
      yourName:
        description: "your name for the certificate"
        required: true
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Passwords not found. Add secrets ANDROID_STORE_PASSWORD and ANDROID_KEY_PASSWORD in Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
          keytool -genkeypair -keystore release.jks -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass:env KS_PASS -keypass:env KEY_PASS \
            -dname "CN=${{ github.event.inputs.yourName }}, O=PetalAxe Studios, C=IN"
          base64 -w0 release.jks > keystore.b64
          echo "keystore generated OK"
      - name: Upload keystore artifact (auto-expires in 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          retention-days: 1
          path: |
            release.jks
            keystore.b64
